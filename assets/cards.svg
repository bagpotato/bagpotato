<g><path d="M0 0 L40 0 A40 40 0 0 0 28 -28 Z" fill="#3B82F6" fill-opacity=".35"/><line x1="0" y1="0" x2="40" y2="0" stroke="#3B82F6" stroke-width="2"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></g>
