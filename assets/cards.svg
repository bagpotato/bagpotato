<g transform="translate(70,70)"><path d="M0 -42 L36 -28 V4 C36 26 18 38 0 46 C-18 38 -36 26 -36 4 V-28 Z" fill="#EC4899" fill-opacity=".12" stroke="#EC4899" stroke-width="2.5"><animate attributeName="stroke-opacity" values="1;.35;1" dur="2.5s" repeatCount="indefinite"/></path>
<path d="M-14 2 L-4 12 L16 -10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="48" stroke-dashoffset="48"><animate attributeName="stroke-dashoffset" values="48;0;0;48" keyTimes="0;.3;.8;1" dur="3.5s" repeatCount="indefinite"/></path></g><text x="30" y="150" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">Hardening</text>
<text x="30" y="176" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#93C5FD">Tight defaults, least privilege,</text><text x="30" y="198" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#93C5FD">reproducible Linux setups.</text></g>
<g transform="translate(820,0)"><rect x="1" y="1" width="378" height="218" rx="16" fill="#0f172a" stroke="#3B82F6" stroke-opacity=".6"/>
