<text x="30" y="176" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#93C5FD">Netplan, DNS, UFW, permissions</text><text x="30" y="198" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#93C5FD">and SSH logs, read-only.</text></g>
