<g transform="translate(30,30)"><path id="mp" d="M0 70 L20 70 L30 40 L44 90 L58 20 L72 80 L86 60 L110 60" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-24" dur="1.2s" repeatCount="indefinite"/></path>
<circle r="5" fill="#EC4899"><animateMotion dur="3s" repeatCount="indefinite" path="M0 70 L20 70 L30 40 L44 90 L58 20 L72 80 L86 60 L110 60"/></circle></g><text x="30" y="150" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">Monitoring</text>
<text x="30" y="176" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#93C5FD">Spot brute-force attempts and</text><text x="30" y="198" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#93C5FD">drift before they become issues.</text></g></svg>